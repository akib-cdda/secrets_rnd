name: Deploy

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Deploy [${{ inputs.env }}]
    runs-on: ubuntu-latest
    # Scopes all `secrets.*` reads to the chosen GH Environment.
    environment: ${{ inputs.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Push secret to Worker
        env:
          SECRET_VALUE: ${{ secrets.SECRET_VALUE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '{"SECRET_VALUE":"%s"}' "$SECRET_VALUE" > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json --env ${{ inputs.env }}
          rm -f /tmp/secrets.json

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env ${{ inputs.env }}
